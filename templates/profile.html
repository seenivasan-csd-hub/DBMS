{% extends "base.html" %}
{% block title %}My profile — Bidwell{% endblock %}
{% block content %}
<div class="page-shell inner-page"><header class="page-heading"><div><span class="eyebrow">YOUR ACCOUNT</span><h1>My profile</h1><p>Keep your account details up to date.</p></div></header>
    <section class="profile-card"><div class="profile-avatar">{{ profile_user.name[:1]|upper }}</div><div><span class="eyebrow">MEMBER SINCE</span><strong>{{ profile_user.created_at|localtime('%B %Y') }}</strong></div>
        <form action="{{ url_for('profile') }}" method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Full name</label><input id="name" name="name" type="text" value="{{ profile_user.name }}" maxlength="100" required><label for="email">Email address</label><input id="email" name="email" type="email" value="{{ profile_user.email }}" maxlength="100" required><button class="button button-primary" type="submit">Save changes</button></form>
    </section>
</div>
{% endblock %}
